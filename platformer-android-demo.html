<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Platformer Android Sederhana</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
      width:100%; height:100%; overflow:hidden; background:#8fd3ff;
      font-family:'Baloo 2','Comic Sans MS','Trebuchet MS','Segoe UI',sans-serif;
    }
    canvas { display:block; width:100%; height:100%; }

    /* ===== HUD skor pill ===== */
    #hud {
      position:fixed; top:14px; left:14px; pointer-events:none; z-index:5;
      display:flex; align-items:center; gap:8px;
      background:linear-gradient(180deg,#fff9e8,#ffe6a8);
      border:3px solid #ffffff; border-radius:999px;
      padding:6px 16px 6px 8px;
      box-shadow:0 4px 0 rgba(0,0,0,0.18), 0 6px 14px rgba(0,0,0,0.22);
    }
    #coinIcon {
      width:26px; height:26px; border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#fff3b0,#ffd23f 55%,#f0a500);
      border:2px solid #c47f00;
      box-shadow:inset 0 0 0 2px rgba(255,255,255,0.35);
      display:flex; align-items:center; justify-content:center;
      color:#a86a00; font-weight:800; font-size:15px;
    }
    #hudScore {
      font-weight:800; font-size:20px; color:#7a4a00;
      text-shadow:0 1px 0 #fff; min-width:24px; text-align:left;
      display:inline-block;
    }
    #hudScore.pop { animation:scorePop .28s ease; }
    @keyframes scorePop {
      0%{ transform:scale(1); }
      40%{ transform:scale(1.5); color:#ff7a00; }
      100%{ transform:scale(1); }
    }

    /* ===== Kontrol sentuh ===== */
    #controls {
      position:fixed; bottom:20px; left:0; width:100%; display:flex;
      justify-content:space-between; padding:0 20px; pointer-events:none; z-index:5;
    }
    .btn {
      pointer-events:auto; width:78px; height:78px; border-radius:50%;
      background:linear-gradient(180deg,#ffffff,#dfefff);
      border:3px solid #ffffff;
      color:#2b7cd3; font-size:30px; font-weight:800;
      display:flex; align-items:center; justify-content:center;
      user-select:none; touch-action:none;
      box-shadow:0 5px 0 rgba(43,124,211,0.35), 0 8px 16px rgba(0,0,0,0.2);
      transition:transform .06s ease, box-shadow .06s ease;
    }
    #jump {
      background:linear-gradient(180deg,#fff0a8,#ffcf4d);
      color:#c06a00; box-shadow:0 5px 0 rgba(192,106,0,0.4), 0 8px 16px rgba(0,0,0,0.2);
    }
    .btn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,0.25); }
    #left { margin-left:6px; }
    #right { margin-left:14px; }

    /* ===== Tombol suara ===== */
    #mute {
      position:fixed; top:16px; right:14px; pointer-events:auto; z-index:5;
      background:linear-gradient(180deg,#ffffff,#dfefff);
      border:3px solid #ffffff; color:#2b7cd3; font-weight:800;
      font-size:13px; padding:8px 14px; border-radius:999px;
      user-select:none; touch-action:manipulation;
      box-shadow:0 4px 0 rgba(43,124,211,0.3), 0 6px 12px rgba(0,0,0,0.18);
    }

    #msg {
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      color:#fff; font-size:20px; text-align:center; text-shadow:1px 1px 2px #000;
      display:none; z-index:5;
    }

    /* ===== Overlay layar ===== */
    .overlay {
      position:fixed; inset:0; z-index:20;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:24px;
      opacity:1; transition:opacity .5s ease; pointer-events:auto;
    }
    .overlay.hidden { opacity:0; pointer-events:none; }
    #startScreen {
      background:radial-gradient(circle at 50% 30%,#bfe9ff,#7fc4ff 55%,#4f9fe8);
    }
    #winScreen {
      background:radial-gradient(circle at 50% 35%,#2f7bd6,#1b4f96 70%,#123a72);
      display:none;
    }
    .card {
      background:rgba(255,255,255,0.16);
      border:3px solid rgba(255,255,255,0.65);
      border-radius:28px; padding:28px 30px;
      box-shadow:0 12px 40px rgba(0,0,0,0.3);
      backdrop-filter:blur(3px);
      animation:cardPop .5s cubic-bezier(.18,.9,.3,1.3);
    }
    @keyframes cardPop { 0%{ transform:scale(.6); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
    .title {
      font-size:40px; font-weight:800; color:#fff; line-height:1.1;
      text-shadow:0 3px 0 #1c60a8, 0 6px 10px rgba(0,0,0,0.35);
      margin-bottom:6px;
    }
    .subtitle { font-size:16px; color:#eaf4ff; margin-bottom:22px; font-weight:600; }
    #winScreen .title { text-shadow:0 3px 0 #0c2d5c, 0 6px 12px rgba(0,0,0,0.45); }
    #winScore { color:#ffe08a; font-weight:800; }
    .playBtn {
      pointer-events:auto; cursor:pointer; border:none;
      font-family:inherit; font-weight:800; font-size:24px; color:#fff;
      padding:16px 44px; border-radius:999px;
      background:linear-gradient(180deg,#ffd23f,#f5941e);
      box-shadow:0 6px 0 #c96a00, 0 10px 20px rgba(0,0,0,0.3);
      transition:transform .08s ease, box-shadow .08s ease;
      text-shadow:0 1px 0 rgba(255,255,255,0.4);
    }
    .playBtn:active { transform:translateY(5px); box-shadow:0 1px 0 #c96a00; }
    .logoBadge {
      width:96px; height:96px; border-radius:24px; margin:0 auto 18px;
      background:linear-gradient(180deg,#ffffff,#e6f1ff);
      border:4px solid #ffffff;
      display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:30px; color:#2f7bd6;
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
    }
    .charPickerLabel {
      font-size:15px; color:#fff; font-weight:700; margin-bottom:10px;
      text-shadow:0 2px 0 rgba(0,0,0,0.25);
    }
    .charPicker {
      display:flex; justify-content:center; gap:14px; margin-bottom:20px;
    }
    .charBtn {
      width:74px; height:74px; border-radius:50%; padding:0; cursor:pointer;
      background:#fff; border:4px solid rgba(255,255,255,0.85);
      box-shadow:0 5px 14px rgba(0,0,0,0.25); overflow:hidden;
      transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
      pointer-events:auto;
    }
    .charBtn img { width:100%; height:100%; object-fit:cover; display:block; border-radius:50%; }
    .charBtn.selected {
      border-color:#ffd23f;
      box-shadow:0 0 0 4px rgba(255,210,63,0.55), 0 6px 16px rgba(0,0,0,0.35);
      transform:scale(1.08);
    }
    .charBtn:active { transform:scale(0.95); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="coinIcon">★</div>
    <span id="hudScore"><span id="score">0</span></span>
  </div>
  <div id="mute">🔊 Suara: ON</div>

  <div id="controls">
    <div style="display:flex;">
      <div class="btn" id="left">←</div>
      <div class="btn" id="right">→</div>
    </div>
    <div class="btn" id="jump">↑</div>
  </div>
  <div id="msg">Sentuh layar untuk mulai</div>

  <!-- Layar mulai -->
  <div id="startScreen" class="overlay">
    <div class="card">
      <div class="logoBadge">LEX</div>
      <div class="title">Petualangan<br>LEX Indonesia</div>
      <div class="subtitle">Lompati kucing, kalahkan bos gede 41/42!</div>
      <div class="charPickerLabel">Pilih Karakter:</div>
      <div class="charPicker" id="charPicker">
        <button class="charBtn selected" data-idx="0" aria-label="Karakter 1"><img id="charImg0" alt=""></button>
        <button class="charBtn" data-idx="1" aria-label="Karakter 2"><img id="charImg1" alt=""></button>
        <button class="charBtn" data-idx="2" aria-label="Karakter 3"><img id="charImg2" alt=""></button>
      </div>
      <button class="playBtn" id="startBtn">▶ MAIN</button>
    </div>
  </div>

  <!-- Layar menang -->
  <div id="winScreen" class="overlay">
    <div class="card">
      <div class="logoBadge">LEX</div>
      <div class="title">SELAMAT TINGGAL<br>LEX INDONESIA</div>
      <div class="subtitle">Skor akhir kamu: <span id="winScore">0</span></div>
      <button class="playBtn" id="replayBtn">↻ Main Lagi</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const msgEl = document.getElementById('msg');

    // ===== Suara (Web Audio API, gaya retro 16-bit) =====
    let actx = null;
    let musicOn = true;
    let musicNext = 0;
    let musicIndex = 0;

    function initAudio() {
      if (!actx) {
        try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch (e) { actx = null; }
        if (actx) musicNext = actx.currentTime + 0.1;
      }
      if (actx && actx.state === 'suspended') actx.resume();
    }

    function beep(freq, dur, type, vol, when) {
      if (!actx) return;
      type = type || 'square';
      vol = (vol == null) ? 0.15 : vol;
      when = when || 0;
      const t = actx.currentTime + when;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }

    function slide(f1, f2, dur, type, vol) {
      if (!actx) return;
      const t = actx.currentTime;
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(f1, t);
      osc.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol == null ? 0.18 : vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.02);
      osc.connect(g); g.connect(actx.destination);
      osc.start(t); osc.stop(t + dur + 0.04);
    }

    function sfxJump()     { slide(320, 720, 0.14, 'square', 0.18); }
    function sfxCoin()     { beep(988, 0.08, 'square', 0.16, 0); beep(1319, 0.16, 'square', 0.16, 0.08); }
    function sfxStomp()    { slide(520, 120, 0.16, 'square', 0.2); }
    function sfxHit()      { beep(180, 0.16, 'sawtooth', 0.22, 0); beep(120, 0.16, 'sawtooth', 0.2, 0.08); }
    function sfxBossDown() { const s=[196,262,330,392,523]; s.forEach((f,i)=>beep(f,0.14,'square',0.2,i*0.12)); }
    function sfxDie()      { beep(392,0.12,'square',0.2,0); beep(311,0.12,'square',0.2,0.12); beep(196,0.24,'square',0.2,0.24); }
    function sfxWin()      { const s=[[523,0.15],[659,0.15],[784,0.15],[1047,0.18],[784,0.12],[1047,0.4]]; let t=0; for(const [f,d] of s){ beep(f,d,'square',0.2,t); t+=d; } }

    // Melodi latar sederhana (orisinal, ceria) yang berulang
    const tune = [
      [523,1],[659,1],[784,1],[659,1],
      [523,1],[587,1],[659,2],
      [698,1],[659,1],[587,1],[523,1],
      [587,1],[494,1],[523,2],
      [392,1],[523,1],[659,1],[587,1],
      [523,1],[440,1],[392,2]
    ];
    function scheduleMusic() {
      if (!actx || !musicOn || !gameRunning) return;
      const beat = 0.17;
      if (musicNext < actx.currentTime) musicNext = actx.currentTime;
      while (musicNext < actx.currentTime + 0.4) {
        const note = tune[musicIndex % tune.length];
        if (note[0] > 0) beep(note[0], beat * note[1] * 0.85, 'triangle', 0.06, musicNext - actx.currentTime);
        musicNext += beat * note[1];
        musicIndex++;
      }
    }
    setInterval(scheduleMusic, 120);

    function toggleMute() {
      musicOn = !musicOn;
      const b = document.getElementById('mute');
      if (b) b.textContent = musicOn ? '🔊 Suara: ON' : '🔇 Suara: OFF';
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const GRAVITY = 0.6;
    const FRICTION = 0.8;
    const MOVE_SPEED = 0.6;
    const MAX_SPEED = 6;
    const JUMP_FORCE = -13;
    const TILE = 40;

    let score = 0;
    let cameraX = 0;
    let gameRunning = false;
    let started = false;
    let won = false;
    let particles = [];

    const hudScoreEl = document.getElementById('hudScore');
    function setScore(v) {
      score = v;
      scoreEl.textContent = score;
      if (hudScoreEl) {
        hudScoreEl.classList.remove('pop');
        void hudScoreEl.offsetWidth; // reflow agar animasi bisa diulang
        hudScoreEl.classList.add('pop');
      }
    }

    const player = {
      x: 80, y: 200, w: 32, h: 48,
      vx: 0, vy: 0,
      onGround: false,
      facingRight: true,
      wasAirborne: false,
      color: '#90a4ae'
    };

    const keys = { left: false, right: false, jump: false };

    function bindButton(id, key) {
      const el = document.getElementById(id);
      const set = (v) => (e) => { e.preventDefault(); keys[key] = v; };
      el.addEventListener('touchstart', set(true), { passive: false });
      el.addEventListener('touchend', set(false), { passive: false });
      el.addEventListener('touchcancel', set(false), { passive: false });
      el.addEventListener('mousedown', set(true));
      el.addEventListener('mouseup', set(false));
      el.addEventListener('mouseleave', set(false));
    }
    bindButton('left', 'left');
    bindButton('right', 'right');
    bindButton('jump', 'jump');

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'ArrowRight') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === ' ') keys.jump = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
      if (e.key === 'ArrowUp' || e.key === ' ') keys.jump = false;
    });

    // ===== Data level =====

    let finishX = 0;

        { x: 0,    y: GROUND_Y, w: 600,  h: 240 },

    // ===== Fisika & pembaruan game =====
    function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    function update() {
      if (!gameRunning) return;

      // Gerak horizontal
      if (keys.left)  { player.vx -= MOVE_SPEED; player.facingRight = false; }
      if (keys.right) { player.vx += MOVE_SPEED; player.facingRight = true; }
      player.vx *= FRICTION;
      if (player.vx > MAX_SPEED) player.vx = MAX_SPEED;
      if (player.vx < -MAX_SPEED) player.vx = -MAX_SPEED;

      // Lompat
      if (keys.jump && player.onGround) {
        player.vy = JUMP_FORCE;
        player.onGround = false;
        sfxJump();
        triggerShout('HIDUP LEX!', 1400);
      }

      // Teriakan otomatis tiap ~4 detik
      if (performance.now() > nextAutoShout) {
        triggerShout('HIDUP LEX!', 1500);
        nextAutoShout = performance.now() + 4200;
      }

      // Gravitasi
      player.vy += GRAVITY;

      // Gerak sumbu X + tabrakan
      player.x += player.vx;
      for (const p of platforms) {
        if (rectsOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
          if (player.vx > 0) player.x = p.x - player.w;
          else if (player.vx < 0) player.x = p.x + p.w;
          player.vx = 0;
        }
      }
      if (player.x < 0) player.x = 0;

      // Gerak sumbu Y + tabrakan
      const fallSpeed = player.vy;
      player.y += player.vy;
      player.onGround = false;
      for (const p of platforms) {
        if (rectsOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)) {
          if (player.vy > 0) { player.y = p.y - player.h; player.onGround = true; }
          else if (player.vy < 0) { player.y = p.y + p.h; }
          player.vy = 0;
        }
      }

      // Debu saat mendarat
      if (player.onGround && player.wasAirborne && fallSpeed > 6) {
        spawnParticles(player.x + player.w / 2, player.y + player.h, { count: 8, colors: ['#eecfa1', '#d7b48a', '#ffffff'], spread: 3.5, up: 1.2, size: 3, life: 22, gravity: 0.05 });
      }
      player.wasAirborne = !player.onGround;

      // Jatuh ke jurang -> ulang dari awal
      if (player.y > 800) { sfxDie(); resetPlayer(); }

      // Ambil koin
      for (const c of coins) {
        if (c.collected) continue;
        if (rectsOverlap(player.x, player.y, player.w, player.h, c.x - c.r, c.y - c.r, c.r * 2, c.r * 2)) {
          c.collected = true;
          setScore(score + 10);
          spawnParticles(c.x, c.y, { count: 10, colors: ['#ffd23f', '#fff3b0', '#ffe066'], spread: 3.5, up: 2.4, size: 3, life: 32 });
          sfxCoin();
        }
      }

      // Musuh
      for (const e of enemies) {
        if (e.x < 0) continue;
        e.x += e.vx;
        if (e.x < e.min || e.x + e.w > e.max) e.vx *= -1;
        if (rectsOverlap(player.x, player.y, player.w, player.h, e.x, e.y, e.w, e.h)) {
          if (player.vy > 0 && (player.y + player.h - e.y) < 22) {
            // Injak musuh dari atas
            const bx = e.x + e.w / 2, by = e.y + e.h / 2;
            e.x = -9999;
            player.vy = JUMP_FORCE / 1.6;
            setScore(score + 20);
            spawnParticles(bx, by, { count: 12, colors: ['#ffffff', '#ffd6a5', '#e67e22'], spread: 4, up: 2, size: 3, life: 30 });
            sfxStomp();
          } else {
            sfxDie();
            resetPlayer();
          }
        }
      }

      // Bos terakhir (ORANG besar)
      if (boss && !boss.defeated) {
        boss.x += boss.vx;
        if (boss.x < boss.min || boss.x + boss.w > boss.max) boss.vx *= -1;
        if (boss.hitCd > 0) boss.hitCd--;
        if (rectsOverlap(player.x, player.y, player.w, player.h, boss.x, boss.y, boss.w, boss.h)) {
          if (player.vy > 0 && (player.y + player.h - boss.y) < 30) {
            // Injak bos dari atas
            player.vy = JUMP_FORCE / 1.4;
            if (boss.hitCd === 0) {
              boss.hp--;
              boss.hitCd = 30;
              const bx = boss.x + boss.w / 2, by = boss.y + boss.h / 2;
              if (boss.hp <= 0) {
                boss.defeated = true;
                setScore(score + 30 + 150);
                spawnParticles(bx, by, { count: 40, colors: ['#ffd23f', '#ff7a00', '#ffffff', '#ff5252'], spread: 7, up: 5, size: 4, life: 50 });
                sfxBossDown();
              } else {
                setScore(score + 30);
                spawnParticles(bx, by, { count: 14, colors: ['#ffffff', '#b0bec5', '#ff5252'], spread: 4.5, up: 2.5, size: 3, life: 28 });
                sfxHit();
              }
            }
          } else if (boss.hitCd === 0) {
            sfxDie();
            resetPlayer();
          }
        }
      }

      // Menang (harus kalahkan bos dulu)
      if (player.x + player.w >= finishX && (!boss || boss.defeated)) {
        showWin();
      }

      // Perbarui partikel
      updateParticles();

      // Kamera ikuti pemain
      cameraX = player.x - canvas.width / 3;
      if (cameraX < 0) cameraX = 0;
    }

    function showWin() {
      if (won) return;
      gameRunning = false;
      won = true;
      musicOn = false;
      sfxWin();
      spawnParticles(player.x + player.w / 2, player.y, { count: 60, colors: ['#ffd23f', '#ff7a00', '#ffffff', '#4dd0e1', '#ff5252'], spread: 8, up: 7, size: 4, life: 70, gravity: 0.12 });
      const ws = document.getElementById('winScore');
      if (ws) ws.textContent = score;
      const winScreen = document.getElementById('winScreen');
      if (winScreen) {
        winScreen.style.display = 'flex';
        void winScreen.offsetWidth;
        winScreen.classList.remove('hidden');
      }
    }

    function resetPlayer() {
      player.x = 80; player.y = 200;
      player.vx = 0; player.vy = 0;
      setScore(0);
      particles = [];
      coins.forEach(c => c.collected = false);
      shoutText = '';
      shoutUntil = 0;
      nextAutoShout = performance.now() + 800;
    }

    function roundRect(rx, ry, rw, rh, r) {
      ctx.beginPath();
      ctx.moveTo(rx + r, ry);
      ctx.arcTo(rx + rw, ry, rx + rw, ry + rh, r);
      ctx.arcTo(rx + rw, ry + rh, rx, ry + rh, r);
      ctx.arcTo(rx, ry + rh, rx, ry, r);
      ctx.arcTo(rx, ry, rx + rw, ry, r);
      ctx.closePath();
    }

    // ===== Sistem partikel (efek visual) =====
    function spawnParticles(x, y, opts) {
      opts = opts || {};
      const n = opts.count || 8;
      const colors = opts.colors || ['#ffd23f', '#fff3b0'];
      const spread = opts.spread || 3;
      const up = opts.up || 2;
      const life = opts.life || 34;
      const size = opts.size || 3;
      const grav = (opts.gravity == null) ? 0.15 : opts.gravity;
      for (let i = 0; i < n; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * spread * 2,
          vy: -Math.random() * up - 0.5,
          life: life, maxLife: life,
          r: size * (0.6 + Math.random() * 0.7),
          color: colors[(Math.random() * colors.length) | 0],
          gravity: grav
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += p.gravity;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ===== Latar storybook =====
    function drawSun(W) {
      const sx = W - 90, sy = 90;
      const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 90);
      glow.addColorStop(0, 'rgba(255,246,180,0.9)');
      glow.addColorStop(1, 'rgba(255,246,180,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(sx, sy, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffe066';
      ctx.beginPath();
      ctx.arc(sx, sy, 38, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff3b0';
      ctx.beginPath();
      ctx.arc(sx, sy, 30, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawHills(offset, baseY, color, amp, step) {
      ctx.save();
      ctx.translate(-Math.floor(offset), 0);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(-100, canvas.height);
      ctx.lineTo(-100, baseY);
      let phase = 0;
      for (let x = -100; x < canvas.width + 400; x += step) {
        const y = baseY - Math.abs(Math.sin(phase)) * amp;
        ctx.quadraticCurveTo(x + step / 2, baseY - amp, x + step, baseY - Math.abs(Math.sin(phase + 1)) * amp);
        phase += 1;
      }
      ctx.lineTo(canvas.width + 400, canvas.height);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawPlayer(x, y) {
      const w = player.w, h = player.h;
      const cx = x + w / 2;
      const airborne = !player.onGround;
      const moving = Math.abs(player.vx) > 0.3 && !airborne;
      // Fase langkah mengikuti jarak tempuh -> kaki bergerak saat berjalan
      const phase = moving ? x * 0.18 : 0;
      const swing = Math.sin(phase) * 6;

      const shirt = '#1b1b1b';
      const skin  = '#e0a97d';
      const pants = '#2f3542';
      const shoe  = '#111';

      const shoulderY = y + 22;
      const hipY = y + 40;
      const legLen = 8;
      const armLen = 12;

      ctx.lineCap = 'round';

      // ===== Kaki (ayun bergantian; saat melompat kaki ditekuk) =====
      let legL, legR;
      if (airborne) { legL = -4; legR = 5; }
      else { legL = swing; legR = -swing; }
      ctx.strokeStyle = pants;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(cx - 4, hipY);
      ctx.lineTo(cx - 4 + legL, hipY + legLen);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + 4, hipY);
      ctx.lineTo(cx + 4 + legR, hipY + legLen);
      ctx.stroke();
      // Sepatu
      ctx.fillStyle = shoe;
      ctx.fillRect(cx - 4 + legL - 4, hipY + legLen - 3, 9, 4);
      ctx.fillRect(cx + 4 + legR - 4, hipY + legLen - 3, 9, 4);

      // ===== Lengan (ayun berlawanan dengan kaki; saat melompat terangkat) =====
      let armL, armR;
      if (airborne) { armL = -7; armR = -7; }
      else { armL = -swing; armR = swing; }
      ctx.strokeStyle = skin;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx - 8, shoulderY + 2);
      ctx.lineTo(cx - 8 + armL, shoulderY + armLen);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + 8, shoulderY + 2);
      ctx.lineTo(cx + 8 + armR, shoulderY + armLen);
      ctx.stroke();

      // ===== Badan (kaus hitam ala Lazada) =====
      ctx.fillStyle = shirt;
      roundRect(cx - 9, shoulderY, 18, hipY - shoulderY + 2, 4);
      ctx.fill();
      // Aksen merah kecil (logo)
      ctx.fillStyle = '#e63946';
      ctx.fillRect(cx + 2, shoulderY + 7, 5, 5);

      // ===== Kepala (foto penuh, simetris - tidak dibalik) =====
      if (headImg.complete && headImg.naturalWidth > 0) {
        const headSize = 34;
        const headX = cx - headSize / 2;
        const headY = y - 10;
        const r = 6; // radius sudut membulat
        ctx.save();
        // Bayangan halus di belakang kepala
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;
        // Bingkai putih tipis
        ctx.fillStyle = '#ffffff';
        roundRect(headX - 2, headY - 2, headSize + 4, headSize + 4, r + 2);
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;
        // Clip rounded-rect lalu gambar foto penuh (TIDAK di-flip agar simetris)
        ctx.beginPath();
        roundRect(headX, headY, headSize, headSize, r);
        ctx.clip();
        ctx.drawImage(headImg, headX, headY, headSize, headSize);
        ctx.restore();
        // Garis tepi tipis
        ctx.strokeStyle = '#1c60a8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        roundRect(headX, headY, headSize, headSize, r);
        ctx.stroke();
      }

      // ===== Balon teriakan "HIDUP LEX!" =====
      const now = performance.now();
      if (shoutText && now < shoutUntil) {
        const remaining = shoutUntil - now;
        const alpha = remaining < 300 ? Math.max(0, remaining / 300) : 1;
        const scaleGrow = remaining > 1100 ? (1 - (remaining - 1100) / 300) : 1; // pop-in
        const s = Math.max(0.4, Math.min(1, scaleGrow));

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = 'bold 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
        const padX = 8, padY = 5;
        const textW = ctx.measureText(shoutText).width;
        const bw = (textW + padX * 2) * s;
        const bh = (16 + padY * 2) * s;
        const headTopY = (headImg.complete && headImg.naturalWidth > 0) ? (y - 10) : (y);
        const bx = cx - bw / 2;
        const by = headTopY - bh - 8;
        // Bayangan balon
        ctx.fillStyle = 'rgba(0,0,0,0.25)';
        roundRect(bx + 1, by + 2, bw, bh, 8 * s);
        ctx.fill();
        // Isi balon
        ctx.fillStyle = '#ffffff';
        roundRect(bx, by, bw, bh, 8 * s);
        ctx.fill();
        ctx.strokeStyle = '#e63946';
        ctx.lineWidth = 2;
        ctx.stroke();
        // Ekor balon menuju kepala
        ctx.beginPath();
        ctx.moveTo(cx - 4, by + bh);
        ctx.lineTo(cx, by + bh + 6);
        ctx.lineTo(cx + 4, by + bh);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#e63946';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 4, by + bh);
        ctx.lineTo(cx, by + bh + 6);
        ctx.lineTo(cx + 4, by + bh);
        ctx.stroke();
        // Teks (merah tebal)
        ctx.fillStyle = '#c62828';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold ' + Math.round(12 * s) + 'px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
        ctx.fillText(shoutText, cx, by + bh / 2 + 1);
        ctx.restore();
      }
    }

    function drawCloud(cx, cy, s) {
      ctx.save();
      // Bayangan lembut bawah awan
      ctx.fillStyle = 'rgba(120,170,220,0.25)';
      ctx.beginPath();
      ctx.ellipse(cx + 22 * s, cy + 16 * s, 40 * s, 10 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      // Gumpalan awan dengan garis tebal
      ctx.beginPath();
      ctx.arc(cx, cy, 18 * s, 0, Math.PI * 2);
      ctx.arc(cx + 20 * s, cy + 4 * s, 22 * s, 0, Math.PI * 2);
      ctx.arc(cx + 46 * s, cy, 18 * s, 0, Math.PI * 2);
      ctx.arc(cx + 22 * s, cy - 12 * s, 16 * s, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 3 * s;
      ctx.strokeStyle = 'rgba(150,190,235,0.9)';
      ctx.stroke();
      // Sorotan cahaya
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(cx + 16 * s, cy - 6 * s, 7 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawTree(bx, s) {
      const baseY = GROUND_Y;
      const trunkW = 16 * s, trunkH = 48 * s;
      ctx.save();
      ctx.lineJoin = 'round';
      // Batang bergaris tebal
      ctx.fillStyle = '#a5744b';
      roundRect(bx - trunkW / 2, baseY - trunkH, trunkW, trunkH, 6 * s);
      ctx.fill();
      ctx.lineWidth = 3 * s;
      ctx.strokeStyle = '#6d4c34';
      ctx.stroke();
      // Rumpun daun (gumpalan) bergaris tebal
      ctx.beginPath();
      ctx.arc(bx, baseY - trunkH - 6 * s, 28 * s, 0, Math.PI * 2);
      ctx.arc(bx - 24 * s, baseY - trunkH + 6 * s, 21 * s, 0, Math.PI * 2);
      ctx.arc(bx + 24 * s, baseY - trunkH + 6 * s, 21 * s, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fillStyle = '#5cc46a';
      ctx.fill();
      ctx.lineWidth = 3.5 * s;
      ctx.strokeStyle = '#2f8f45';
      ctx.stroke();
      // Sorotan daun
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath();
      ctx.arc(bx - 8 * s, baseY - trunkH - 14 * s, 12 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawGrass(gx, gy) {
      ctx.strokeStyle = '#1e8449';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        const bx = gx + i * 4;
        ctx.beginPath();
        ctx.moveTo(bx, gy);
        ctx.lineTo(bx - 2 + i, gy - 7);
        ctx.stroke();
      }
    }

    function drawCat(e) {
      const dir = e.vx >= 0 ? 1 : -1;
      const x = e.x, y = e.y, w = e.w, h = e.h;
      const cx = x + w / 2;
      // Ekor
      ctx.strokeStyle = '#e67e22';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - dir * (w / 2 - 2), y + h - 6);
      ctx.quadraticCurveTo(cx - dir * (w / 2 + 8), y + h - 18, cx - dir * (w / 2 + 2), y + 2);
      ctx.stroke();
      // Kaki
      ctx.fillStyle = '#d35400';
      ctx.fillRect(x + 4, y + h - 5, 6, 5);
      ctx.fillRect(x + w - 10, y + h - 5, 6, 5);
      // Badan
      ctx.fillStyle = '#e67e22';
      roundRect(x + 3, y + 8, w - 6, h - 10, 8);
      ctx.fill();
      // Kepala
      const hr = 11;
      const hx = cx + dir * 5;
      const hy = y + 8;
      ctx.fillStyle = '#e67e22';
      ctx.beginPath();
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
      // Telinga
      ctx.beginPath();
      ctx.moveTo(hx - 8, hy - 6); ctx.lineTo(hx - 3, hy - 15); ctx.lineTo(hx - 1, hy - 6); ctx.closePath();
      ctx.moveTo(hx + 8, hy - 6); ctx.lineTo(hx + 3, hy - 15); ctx.lineTo(hx + 1, hy - 6); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffccbc';
      ctx.beginPath();
      ctx.moveTo(hx - 6, hy - 7); ctx.lineTo(hx - 3, hy - 12); ctx.lineTo(hx - 1, hy - 7); ctx.closePath();
      ctx.moveTo(hx + 6, hy - 7); ctx.lineTo(hx + 3, hy - 12); ctx.lineTo(hx + 1, hy - 7); ctx.closePath();
      ctx.fill();
      // Mata
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(hx - 4, hy - 1, 3, 0, Math.PI * 2);
      ctx.arc(hx + 4, hy - 1, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(hx - 4 + dir, hy - 1, 1.5, 0, Math.PI * 2);
      ctx.arc(hx + 4 + dir, hy - 1, 1.5, 0, Math.PI * 2);
      ctx.fill();
      // Hidung
      ctx.fillStyle = '#c0392b';
      ctx.beginPath();
      ctx.arc(hx, hy + 4, 1.6, 0, Math.PI * 2);
      ctx.fill();
      // Kumis
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(hx - 2, hy + 4); ctx.lineTo(hx - 10, hy + 2);
      ctx.moveTo(hx - 2, hy + 5); ctx.lineTo(hx - 10, hy + 6);
      ctx.moveTo(hx + 2, hy + 4); ctx.lineTo(hx + 10, hy + 2);
      ctx.moveTo(hx + 2, hy + 5); ctx.lineTo(hx + 10, hy + 6);
      ctx.stroke();

      // Bendera dengan label
      if (e.label) {
        const poleX = x + 6;
        const poleTop = y - 22;
        ctx.strokeStyle = '#5d4037';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(poleX, y + 10);
        ctx.lineTo(poleX, poleTop);
        ctx.stroke();
        // Kain bendera
        const fw = e.label.length * 7 + 8;
        const fh = 15;
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(poleX, poleTop, fw, fh);
        ctx.strokeStyle = '#7b241c';
        ctx.lineWidth = 1;
        ctx.strokeRect(poleX, poleTop, fw, fh);
        // Teks label
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px Arial, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.label, poleX + 4, poleTop + fh / 2 + 1);
        ctx.restore();
      }
    }

    function drawBossDog(b) {
      const dir = b.vx >= 0 ? 1 : -1;
      const x = b.x, y = b.y, w = b.w, h = b.h;
      const cx = x + w / 2;
      const baseY = y + h;

      // Ekor
      ctx.strokeStyle = '#455a64';
      ctx.lineWidth = 11;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - dir * (w / 2 - 6), baseY - 26);
      ctx.quadraticCurveTo(cx - dir * (w / 2 + 20), baseY - 46, cx - dir * (w / 2 + 6), baseY - 66);
      ctx.stroke();

      // Kaki
      ctx.fillStyle = '#546e7a';
      ctx.fillRect(x + 14, baseY - 14, 14, 14);
      ctx.fillRect(x + 34, baseY - 14, 14, 14);
      ctx.fillRect(x + w - 48, baseY - 14, 14, 14);
      ctx.fillRect(x + w - 28, baseY - 14, 14, 14);

      // Badan
      ctx.fillStyle = '#607d8b';
      roundRect(x + 8, y + 18, w - 16, h - 26, 24);
      ctx.fill();

      // Kepala besar (di sisi arah jalan)
      const hr = 28;
      const hx = cx + dir * 28;
      const hy = y + 26;
      // Telinga terkulai
      ctx.fillStyle = '#455a64';
      ctx.beginPath();
      ctx.ellipse(hx - dir * 20, hy - 4, 9, 20, dir * 0.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(hx + dir * 18, hy - 6, 8, 16, -dir * 0.3, 0, Math.PI * 2);
      ctx.fill();
      // Wajah
      ctx.fillStyle = '#607d8b';
      ctx.beginPath();
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
      // Moncong
      ctx.fillStyle = '#78909c';
      ctx.beginPath();
      ctx.ellipse(hx + dir * 16, hy + 10, 16, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      // Hidung
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(hx + dir * 26, hy + 8, 5, 0, Math.PI * 2);
      ctx.fill();
      // Mulut
      ctx.strokeStyle = '#263238';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx + dir * 20, hy + 16);
      ctx.lineTo(hx + dir * 6, hy + 18);
      ctx.stroke();
      // Mata
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(hx - dir * 4, hy - 6, 6, 0, Math.PI * 2);
      ctx.arc(hx + dir * 12, hy - 6, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(hx - dir * 4 + dir * 2, hy - 6, 3, 0, Math.PI * 2);
      ctx.arc(hx + dir * 12 + dir * 2, hy - 6, 3, 0, Math.PI * 2);
      ctx.fill();

      // Kalung merah
      ctx.strokeStyle = '#c0392b';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(hx, hy + hr - 4, hr - 6, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();

      // Papan tanda "41/42" di atas
      const label = b.label;
      ctx.font = 'bold 20px Arial, sans-serif';
      const fw = ctx.measureText(label).width + 24;
      const fh = 30;
      const boardX = cx - fw / 2;
      const boardY = y - 54;
      ctx.fillStyle = '#5d4037';
      ctx.fillRect(cx - 3, boardY + fh, 6, 22);
      ctx.fillStyle = '#a11d1d';
      roundRect(boardX, boardY, fw, fh, 6);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 20px Arial, sans-serif';
      ctx.fillText(label, cx, boardY + fh / 2 + 1);
      ctx.restore();

      // Nyawa bos (pip merah)
      for (let i = 0; i < b.hp; i++) {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(boardX + 8 + i * 14, boardY - 10, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawFinishCat(bx) {
      const baseY = GROUND_Y;
      const cx = bx + 20;

      // ===== Papan tanda "LEX INDONESIA" di atas =====
      const boardW = 120, boardH = 46;
      const boardX = cx - boardW / 2;
      const boardY = baseY - 190;
      // Tiang
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(cx - 3, boardY + boardH, 6, 40);
      // Papan
      ctx.fillStyle = '#ffffff';
      roundRect(boardX, boardY, boardW, boardH, 8);
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#f57c00';
      ctx.stroke();
      // Teks
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#0b1f5b';
      ctx.font = 'bold 24px Arial, sans-serif';
      ctx.fillText('LEX', cx, boardY + 17);
      ctx.fillStyle = '#f57c00';
      ctx.font = 'bold 12px Arial, sans-serif';
      ctx.fillText('INDONESIA', cx, boardY + 34);
      ctx.restore();

      // ===== Kucing besar =====
      const bw = 84, bh = 70;
      const bodyX = cx - bw / 2;
      const bodyY = baseY - bh;

      // Ekor melengkung
      ctx.strokeStyle = '#e67e22';
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(bodyX + bw - 6, baseY - 12);
      ctx.quadraticCurveTo(bodyX + bw + 34, baseY - 30, bodyX + bw + 18, baseY - 70);
      ctx.stroke();

      // Kaki depan
      ctx.fillStyle = '#d35400';
      ctx.fillRect(cx - 26, baseY - 12, 18, 12);
      ctx.fillRect(cx + 8, baseY - 12, 18, 12);

      // Badan
      ctx.fillStyle = '#e67e22';
      roundRect(bodyX, bodyY, bw, bh, 20);
      ctx.fill();
      // Perut lebih terang
      ctx.fillStyle = '#f8b26a';
      roundRect(cx - 20, bodyY + 18, 40, bh - 24, 14);
      ctx.fill();

      // Badge "LEX" di dada
      ctx.fillStyle = '#0b1f5b';
      roundRect(cx - 20, bodyY + 26, 40, 20, 5);
      ctx.fill();
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial, sans-serif';
      ctx.fillText('LEX', cx, bodyY + 37);
      ctx.restore();

      // Kepala besar
      const hr = 34;
      const hx = cx;
      const hy = bodyY - 10;
      // Telinga
      ctx.fillStyle = '#e67e22';
      ctx.beginPath();
      ctx.moveTo(hx - 26, hy - 18); ctx.lineTo(hx - 14, hy - 44); ctx.lineTo(hx - 4, hy - 20); ctx.closePath();
      ctx.moveTo(hx + 26, hy - 18); ctx.lineTo(hx + 14, hy - 44); ctx.lineTo(hx + 4, hy - 20); ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#ffccbc';
      ctx.beginPath();
      ctx.moveTo(hx - 22, hy - 20); ctx.lineTo(hx - 14, hy - 38); ctx.lineTo(hx - 8, hy - 21); ctx.closePath();
      ctx.moveTo(hx + 22, hy - 20); ctx.lineTo(hx + 14, hy - 38); ctx.lineTo(hx + 8, hy - 21); ctx.closePath();
      ctx.fill();
      // Wajah
      ctx.fillStyle = '#e67e22';
      ctx.beginPath();
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
      // Mata
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(hx - 12, hy - 4, 8, 0, Math.PI * 2);
      ctx.arc(hx + 12, hy - 4, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(hx - 12, hy - 4, 4, 0, Math.PI * 2);
      ctx.arc(hx + 12, hy - 4, 4, 0, Math.PI * 2);
      ctx.fill();
      // Hidung
      ctx.fillStyle = '#c0392b';
      ctx.beginPath();
      ctx.moveTo(hx - 5, hy + 6); ctx.lineTo(hx + 5, hy + 6); ctx.lineTo(hx, hy + 11); ctx.closePath();
      ctx.fill();
      // Senyum
      ctx.strokeStyle = '#7b3f00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx, hy + 11);
      ctx.quadraticCurveTo(hx - 8, hy + 18, hx - 14, hy + 12);
      ctx.moveTo(hx, hy + 11);
      ctx.quadraticCurveTo(hx + 8, hy + 18, hx + 14, hy + 12);
      ctx.stroke();
      // Kumis
      ctx.strokeStyle = 'rgba(0,0,0,0.45)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hx - 6, hy + 8); ctx.lineTo(hx - 30, hy + 4);
      ctx.moveTo(hx - 6, hy + 10); ctx.lineTo(hx - 30, hy + 12);
      ctx.moveTo(hx + 6, hy + 8); ctx.lineTo(hx + 30, hy + 4);
      ctx.moveTo(hx + 6, hy + 10); ctx.lineTo(hx + 30, hy + 12);
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Latar langit pastel storybook
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#aee4ff');
      gradient.addColorStop(0.55, '#cdeeff');
      gradient.addColorStop(1, '#eafaf1');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Matahari (diam di sudut)
      drawSun(canvas.width);

      // Bukit berlapis (parallax) - lapisan jauh ke dekat
      drawHills(cameraX * 0.15, GROUND_Y + 30, '#bfe8c8', 70, 220);
      drawHills(cameraX * 0.3, GROUND_Y + 55, '#9edcae', 55, 170);

      // Awan (parallax: bergerak lebih lambat dari dunia)
      ctx.save();
      ctx.translate(-Math.floor(cameraX * 0.5), 0);
      for (const cl of clouds) drawCloud(cl.x, cl.y, cl.s);
      ctx.restore();

      ctx.save();
      ctx.translate(-Math.floor(cameraX), 0);

      // Pohon (di belakang tanah)
      for (const t of trees) drawTree(t.x, t.s);

      // Tanah/platform dengan sudut membulat, kilau, dan bayangan
      for (const p of platforms) {
        // Bayangan bawah
        ctx.fillStyle = 'rgba(30,80,50,0.18)';
        roundRect(p.x + 3, p.y + 5, p.w, p.h, 10);
        ctx.fill();
        // Tanah cokelat
        ctx.fillStyle = '#8d6e4f';
        roundRect(p.x, p.y, p.w, p.h, 10);
        ctx.fill();
        // Lapisan rumput atas
        ctx.fillStyle = '#5cc46a';
        roundRect(p.x, p.y, p.w, Math.min(14, p.h), 10);
        ctx.fill();
        // Kilau tipis di garis rumput
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(p.x + 8, p.y + 3, Math.max(0, p.w - 16), 2);
      }

      // Rumput di atas tanah
      for (const p of platforms) {
        if (p.h < 60) continue;
        for (let gx = p.x + 12; gx < p.x + p.w - 12; gx += 34) {
          drawGrass(gx, p.y);
        }
      }

      // Koin berkilau dengan bayangan
      for (const c of coins) {
        if (c.collected) continue;
        const bob = Math.sin((Date.now() / 300) + c.x) * 2;
        const cy = c.y + bob;
        // Bayangan
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.ellipse(c.x, c.y + c.r + 6, c.r * 0.8, c.r * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        // Glow
        const g = ctx.createRadialGradient(c.x, cy, 1, c.x, cy, c.r + 6);
        g.addColorStop(0, 'rgba(255,231,120,0.9)');
        g.addColorStop(1, 'rgba(255,231,120,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(c.x, cy, c.r + 6, 0, Math.PI * 2);
        ctx.fill();
        // Badan koin
        ctx.fillStyle = '#ffd23f';
        ctx.beginPath();
        ctx.arc(c.x, cy, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#e69500';
        ctx.stroke();
        // Bintang / kilau
        ctx.fillStyle = '#fff3b0';
        ctx.beginPath();
        ctx.arc(c.x - c.r * 0.3, cy - c.r * 0.3, c.r * 0.28, 0, Math.PI * 2);
        ctx.fill();
      }

      // Musuh (kucing)
      for (const e of enemies) {
        if (e.x < 0) continue;
        drawCat(e);
      }

      // Bos terakhir: ORANG besar 41/42
      if (boss && !boss.defeated) drawBossDog(boss);

      // Bonus terakhir: kucing besar LEX Indonesia
      drawFinishCat(finishX);

      drawPlayer(Math.floor(player.x), Math.floor(player.y));

      // Partikel efek visual (di dalam dunia)
      drawParticles();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Mulai / mulai ulang permainan
    function hideOverlay(el) {
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(() => { el.style.display = 'none'; }, 320);
    }

    function startGame() {
      initAudio();
      msgEl.style.display = 'none';
      hideOverlay(document.getElementById('startScreen'));
      hideOverlay(document.getElementById('winScreen'));
      started = true;
      won = false;
      gameRunning = true;
      musicOn = true;
      if (actx) musicNext = actx.currentTime;
      resetPlayer();
      buildLevel();
    }

    const muteBtn = document.getElementById('mute');
    muteBtn.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); toggleMute(); });
    muteBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); initAudio(); toggleMute(); }, { passive: false });

    const startBtn = document.getElementById('startBtn');
    const replayBtn = document.getElementById('replayBtn');
    function wireStart(btn) {
      if (!btn) return;
      btn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
      btn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); startGame(); }, { passive: false });
    }
    wireStart(startBtn);
    wireStart(replayBtn);

    // ===== Pemilihan karakter (thumbnail di layar mulai) =====
    function paintCharPicker() {
      for (let i = 0; i < characterImages.length; i++) {
        const img = document.getElementById("charImg" + i);
        if (img) img.src = characterImages[i];
      }
    }
    function selectCharacter(i) {
      if (i < 0 || i >= characterImages.length) return;
      selectedCharIdx = i;
      headImg.src = characterImages[i];
      document.querySelectorAll(".charBtn").forEach((b) => b.classList.remove("selected"));
      const btn = document.querySelector(".charBtn[data-idx=\"" + i + "\"]");
      if (btn) btn.classList.add("selected");
    }
    paintCharPicker();
    selectCharacter(0);
    document.querySelectorAll(".charBtn").forEach((btn) => {
      const idx = parseInt(btn.getAttribute("data-idx"), 10);
      const pick = (e) => { e.stopPropagation(); e.preventDefault && e.preventDefault(); selectCharacter(idx); };
      btn.addEventListener("click", pick);
      btn.addEventListener("touchstart", pick, { passive: false });
    });

    loop();
  </script>
</body>
</html>
